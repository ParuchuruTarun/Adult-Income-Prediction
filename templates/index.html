<!DOCTYPE html>
<html>
<head>
    <title>Student Placement Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f7fc;
            color: #333;
        }
        .form-container {
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 12px;
            background-color: white;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
        .form-container h2 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 20px;
        }
        .form-container label {
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
            color: #555;
        }
        .form-container input, .form-container select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .form-container input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }
        .form-container input[type="submit"]:hover {
            background-color: #45a049;
        }
        .form-container select {
            font-size: 16px;
        }
        .form-container input[type="number"] {
            font-size: 16px;
        }
        .form-container input[type="submit"]:active {
            background-color: #388e3c;
        }
        .result {
            font-size: 1.5em;
            color: #4CAF50;
            text-align: center;
            margin-top: 20px;
        }
        /* Add responsive styles */
        @media (max-width: 768px) {
            .form-container {
                max-width: 90%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Student Placement Prediction</h2>
        <form action="/predict" method="post">
            
            <label for="age">Age:</label>
            <input type="number" name="AGE" required>

            <label for="education">Education Level:</label>
            <select name="education" required>
                <option value="0">1st-4th</option>
                <option value="1">10th</option>
                <option value="2">11th</option>
                <option value="3">12th</option>
                <option value="4">5th-6th</option>
                <option value="5">7th-8th</option>
                <option value="6">9th</option>
                <option value="7">Assoc-acdm</option>
                <option value="8">Assoc-voc</option>
                <option value="9">Bachelors</option>
                <option value="10">Doctorate</option>
                <option value="11">HS-grad</option>
                <option value="12">Masters</option>
                <option value="13">Preschool</option>
                <option value="14">Prof-school</option>
                <option value="15">Some-college</option>
            </select>


            <label for="education_num">Education Num:</label>
            <select name="education_num" required>
                <option value="1">Preschool</option>
                <option value="2">1st-4th</option>
                <option value="3">5th-6th</option>
                <option value="4">7th-8th</option>
                <option value="5">9th</option>
                <option value="6">10th</option>
                <option value="7">11th</option>
                <option value="8">12th</option>
                <option value="9">HS-grad</option>
                <option value="10">Some-college</option>
                <option value="11">Assoc-voc</option>
                <option value="12">Assoc-acdm</option>
                <option value="13">Bachelors</option>
                <option value="14">Masters</option>
                <option value="15">Prof-school</option>
                <option value="16">Doctorate</option>
            </select>

            <label for="marital_status">Marital Status:</label>
            <select name="marital_status" required>
                <option value="0">Divorced</option>
                <option value="1">Married-AF-spouse</option>
                <option value="2">Married-civ-spouse</option>
                <option value="3">Married-spouse-absent</option>
                <option value="4">Never-married</option>
                <option value="5">Separated</option>
                <option value="6">Widowed</option>
            </select>


            <label for="relationship">Relationship:</label>
            <select name="relationship" required>
                <option value="0">Husband</option>
                <option value="1">Not-in-family</option>
                <option value="2">Other-relative</option>
                <option value="3">Own-child</option>
                <option value="4">Unmarried</option>
                <option value="5">Wife</option>
            </select>

            <label for="race">Race:</label>
            <select name="race" required>
                <option value="0">Amer-Indian-Eskimo</option>
                <option value="1">Asian-Pac-Islander</option>
                <option value="2">Black</option>
                <option value="3">Other</option>
                <option value="4">White</option>
            </select>            

            <label for="sex">Gender:</label>
            <select name="sex" required>
                <option value="0">Female</option>
                <option value="1">Male</option>
            </select>


            <label for="capital_gain">Capital Gain:</label>
            <input type="number" step="0.01" name="capital_gain" required>

            <label for="capital_loss">Capital Loss:</label>
            <input type="number" step="0.01" name="capital_loss" required>

            <label for="hours_per_week">Hours per Week:</label>
            <input type="number" step="1" name="hours_per_week" required>

            
            <input type="submit" value="Predict">
        </form>
        {% if prediction_text %}
        <div class="result">{{ prediction_text }}</div>
        {% endif %}
    </div>
</body>
</html>
